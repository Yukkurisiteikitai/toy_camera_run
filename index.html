<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>PULSURA</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="overlay">
            <div id="loading">Initialize Camera...</div>
        </div>

        <div id="ui-layer">
            <h1>PULSURA</h1>
            <p>Movement becomes ink. / 動きが色として堆積する</p>
        </div>

        <button
            id="menu-button"
            type="button"
            aria-label="設定を開く"
            aria-expanded="false"
        >
            <span class="menu-lines" aria-hidden="true"></span>
        </button>

        <div id="controls">
            <div class="controls-header">
                <div class="controls-title">Studio</div>
                <div class="controls-dot" aria-hidden="true"></div>
            </div>
            <div class="control-row">
                <label for="video-file">Video Source</label>
                <input id="video-file" type="file" accept="video/*" />
            </div>
            <div class="control-row">
                <label for="ink-color">Ink Color</label>
                <input id="ink-color" type="color" value="#ff5a7a" />
            </div>
            <div class="control-row">
                <label for="color-mix">Color Mix</label>
                <input
                    id="color-mix"
                    type="range"
                    min="0"
                    max="100"
                    value="42"
                />
            </div>
            <div class="button-row">
                <button id="use-camera" type="button">Camera</button>
                <button id="clear-ink" type="button">Clear</button>
            </div>
            <div class="control-row">
                <button id="fullscreen-view" type="button">全体表示</button>
            </div>
        </div>

        <a
            id="github-link"
            href="https://github.com/Yukkurisiteikitai/pulsura"
            target="_blank"
            rel="noreferrer"
            aria-label="GitHub repository"
            title="GitHub repository"
        >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path
                    fill="currentColor"
                    d="M8 .297c-4.42 0-8 3.58-8 8 0 3.54 2.29 6.58 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.01.08-2.1 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.09.16 1.9.08 2.1.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                />
            </svg>
        </a>

        <!-- Three.js Library -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="js/shaders.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
